server:
  port: 8080

spring:
  application:
    name: kb-agent

# ============ 大模型配置（兼容 OpenAI 协议） ============
# 本项目未使用任何大模型 SDK，直接按 OpenAI Chat Completions 协议调用，
# 因此 DeepSeek / 通义千问 / 智谱 / 豆包 / OpenAI 均可使用，只需改下面三项。
llm:
  # DeepSeek: https://api.deepseek.com
  # 通义千问(兼容模式): https://dashscope.aliyuncs.com/compatible-mode/v1
  # 智谱: https://open.bigmodel.cn/api/paas/v4
  # 豆包(火山方舟): https://ark.cn-beijing.volces.com/api/v3
  base-url: https://api.deepseek.com
  api-key: ""            # TODO: 在这里填入你的 API Key（DeepSeek 开放平台申请，新用户有免费额度）
  model: deepseek-chat
  temperature: 0.3       # 越低越稳定，适合知识库问答
  max-tokens: 2048
  timeout-seconds: 60

# ============ Agent 配置 ============
agent:
  max-iterations: 5      # 单轮对话中最多允许的「模型→工具→模型」循环次数，防止死循环
  history-size: 10       # 携带给模型的历史消息条数（不含本次提问）

# ============ 工具配置 ============
tools:
  weather:
    # true : 返回模拟天气，无需联网、演示稳定；false: 调用 Open-Meteo 免费天气接口（无需 Key）
    mock: true
